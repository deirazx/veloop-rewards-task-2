<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="microBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1033" />
      <stop offset="50%" stop-color="#110C24" />
      <stop offset="100%" stop-color="#080612" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" rx="32" fill="url(#microBg)" />
  <rect width="796" height="496" x="2" y="2" rx="30" fill="none" stroke="#2D2152" stroke-width="2" />

  <!-- Ambient Glowing Spheres -->
  <circle cx="700" cy="120" r="160" fill="#7C3AED" opacity="0.18" filter="url(#glow2)" />
  <circle cx="100" cy="380" r="140" fill="#38BDF8" opacity="0.14" filter="url(#glow2)" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="800" height="6" fill="url(#purpleGlow)" />

  <!-- Lightning Bolt Icon & Header -->
  <g transform="translate(60, 65)">
    <rect width="52" height="52" rx="14" fill="#2E1B5B" stroke="#4C2889" stroke-width="1.5" />
    <!-- Lightning Bolt SVG Path -->
    <path d="M 28 14 L 18 30 L 26 30 L 22 42 L 36 24 L 28 24 Z" fill="#FDE047" stroke="#EAB308" stroke-width="1" />

    <text x="70" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" letter-spacing="0.5">DAILY MICRO-REWARD</text>
    <text x="70" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#A855F7" letter-spacing="1">INSTANT DIGITAL REDEMPTION</text>
  </g>

  <!-- Amazon Pay Pill Badge -->
  <rect x="580" y="70" width="160" height="38" rx="19" fill="#221544" stroke="#482E7E" stroke-width="1.5" />
  <text x="660" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="1">TOKEN DRAW</text>

  <!-- Center Big Value Display -->
  <g transform="translate(60, 220)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#94A3B8" letter-spacing="2">AMAZON RECHARGE / GIFT VOUCHER</text>
    <text x="0" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="96" font-weight="900" fill="url(#purpleGlow)" letter-spacing="-2">₹20</text>
  </g>

  <!-- Token Cost Badge Graphic -->
  <g transform="translate(560, 240)">
    <rect width="180" height="66" rx="16" fill="#1C1535" stroke="#3F296D" stroke-width="1.5" />
    <circle cx="34" cy="33" r="14" fill="#38BDF8" opacity="0.2" />
    <circle cx="34" cy="33" r="8" fill="#38BDF8" />
    <text x="60" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94A3B8">ENTRY FEE</text>
    <text x="60" y="49" font-family="monospace" font-size="16" font-weight="900" fill="#FFFFFF">2,000 TOKENS</text>
  </g>

  <!-- Bottom Divider & Details -->
  <line x1="60" y1="395" x2="740" y2="395" stroke="#251A45" stroke-width="1.5" />

  <g transform="translate(60, 440)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#A855F7">INSTANT MOBILE &amp; SHOPPING RECHARGE</text>
    <text x="0" y="20" font-family="monospace" font-size="12" fill="#64748B">100% PROVABLY FAIR COMMUNITY POOL • FAST DISPATCH</text>
  </g>

  <g transform="translate(740, 445)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#38BDF8" text-anchor="end">VELOOP REWARDS</text>
  </g>
</svg>
